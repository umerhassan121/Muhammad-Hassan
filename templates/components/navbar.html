<nav class="topbar" aria-label="Top navigation">
    <div class="d-flex align-items-center gap-3">
        <button type="button" class="btn btn-light d-lg-none" onclick="toggleSidebar()" aria-label="Toggle menu">
            <i class="bi bi-list" aria-hidden="true"></i>
        </button>
        <span class="page-title">{% block page_title %}Dashboard{% endblock %}</span>
    </div>

    <div class="user-menu d-flex align-items-center gap-3">

        <!-- Notification bell -->
        <div class="position-relative">
            <button type="button" class="notification-bell btn btn-link p-0 border-0 position-relative"
                    id="notificationBell" aria-label="Notifications" aria-haspopup="true" aria-expanded="false"
                    aria-controls="notificationDropdown">
                <i class="bi bi-bell-fill text-secondary" style="font-size:1.4rem;" aria-hidden="true"></i>
                <span id="notificationBadge" class="notification-badge" style="display:none;" aria-live="polite">0</span>
            </button>

            <div id="notificationDropdown" class="notification-dropdown" role="dialog" aria-label="Notifications">
                <div class="notification-header">
                    <span><i class="bi bi-bell-fill" aria-hidden="true"></i> Notifications</span>
                    <a href="#" class="mark-all-read" id="markAllReadLink">Mark all as read</a>
                </div>

                <div class="notification-categories" role="tablist" aria-label="Notification categories">
                    <button type="button" class="category-btn active" data-category="all"><i class="bi bi-bell" aria-hidden="true"></i> All</button>
                    <button type="button" class="category-btn" data-category="orders"><i class="bi bi-bag-check" aria-hidden="true"></i> Orders</button>
                    <button type="button" class="category-btn" data-category="vendors"><i class="bi bi-shop" aria-hidden="true"></i> Vendors</button>
                    <button type="button" class="category-btn" data-category="riders"><i class="bi bi-bicycle" aria-hidden="true"></i> Riders</button>
                    <button type="button" class="category-btn" data-category="disputes"><i class="bi bi-exclamation-triangle" aria-hidden="true"></i> Disputes</button>
                    <button type="button" class="category-btn" data-category="payments"><i class="bi bi-currency-rupee" aria-hidden="true"></i> Payments</button>
                    <button type="button" class="category-btn" data-category="sales"><i class="bi bi-cart" aria-hidden="true"></i> Sales</button>
                    <button type="button" class="category-btn" data-category="installments"><i class="bi bi-calendar" aria-hidden="true"></i> Installments</button>
                    <button type="button" class="category-btn" data-category="stock"><i class="bi bi-box" aria-hidden="true"></i> Stock</button>
                    <button type="button" class="category-btn" data-category="security"><i class="bi bi-shield-lock" aria-hidden="true"></i> Security</button>
                    <button type="button" class="category-btn" data-category="marketing"><i class="bi bi-megaphone" aria-hidden="true"></i> Marketing</button>
                    <button type="button" class="category-btn" data-category="system"><i class="bi bi-gear" aria-hidden="true"></i> System</button>
                </div>
                <div class="notification-tools">
                    <label class="notif-unread-toggle"><input type="checkbox" id="notifUnreadOnly"> Unread only</label>
                    <input type="search" id="notifSearch" class="notif-search" placeholder="Search..." aria-label="Search notifications" autocomplete="off">
                </div>

                <div id="notificationList" class="notification-scroll">
                    <div class="text-center p-3 text-muted">
                        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                        Loading...
                    </div>
                </div>
                <div class="notification-footer">
                    <a href="/notifications/" class="notification-view-all">View all notifications</a>
                </div>
            </div>
        </div>

        <!-- Dashboard shortcut -->
        <a href="{% url 'dashboard' %}" class="btn-icon" title="Dashboard" aria-label="Dashboard">
            <i class="bi bi-speedometer2 text-secondary" style="font-size:1.3rem;" aria-hidden="true"></i>
        </a>

        <!-- User dropdown -->
        <div class="dropdown">
            <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle" aria-hidden="true"></i>
                <span class="d-none d-sm-inline">{{ request.user.get_full_name|default:request.user.username|title }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                <li class="dropdown-header">
                    Signed in as<br><strong>{{ request.user.username }}</strong>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <a class="dropdown-item" href="{% url 'admin:password_change' %}">
                        <i class="bi bi-key" aria-hidden="true"></i> Change Password
                    </a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form method="POST" action="{% url 'admin:logout' %}" class="m-0 p-0">
                        {% csrf_token %}
                        <button type="submit" class="dropdown-item text-danger">
                            <i class="bi bi-box-arrow-right" aria-hidden="true"></i> Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<style>
    .notification-categories {
        padding: 8px 12px;
        background: #f8f9fa;
        border-bottom: 1px solid #e9ecef;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
    }
    
    .category-btn {
        background: white;
        border: 1px solid #dee2e6;
        border-radius: 20px;
        padding: 4px 10px;
        font-size: 11px;
        cursor: pointer;
        transition: all 0.2s ease;
        color: #495057;
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }
    
    .category-btn:hover {
        background: #e9ecef;
    }
    
    .category-btn.active {
        background: #667eea;
        border-color: #667eea;
        color: white;
    }
    
    .category-btn i {
        font-size: 10px;
    }
    
    @media (max-width: 576px) {
        .notification-categories {
            padding: 6px 10px;
            gap: 4px;
        }
        .category-btn {
            padding: 3px 8px;
            font-size: 9px;
        }
        .category-btn i {
            font-size: 9px;
        }
    }

    .notification-bell { background: none; line-height: 1; cursor: pointer; }
    .notification-scroll { max-height: 350px; overflow-y: auto; }
    .notification-view-all { color: #667eea; text-decoration: none; font-size: 12px; }
    .notification-view-all:hover { text-decoration: underline; }
    .notification-item { cursor: pointer; }
    .notification-categories { flex-wrap: nowrap !important; overflow-x: auto; scrollbar-width: thin; }
    .category-btn { white-space: nowrap; flex-shrink: 0; }
    .notification-tools { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid #e9ecef; background: #fff; }
    .notif-unread-toggle { font-size: 11px; color: #495057; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; margin: 0; cursor: pointer; }
    .notif-search { flex: 1; min-width: 0; border: 1px solid #dee2e6; border-radius: 14px; padding: 3px 10px; font-size: 12px; }
    .notification-item.prio-critical { border-left: 4px solid #dc2626; }
    .notification-item.prio-critical.unread { background: rgba(220,38,38,0.08); }
    .notification-item.prio-high { border-left: 4px solid #f59e0b; }
    .notification-item.prio-low .notification-title { font-weight: 500; opacity: .8; }
    .notif-badge { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 0 6px; margin-left: 4px; vertical-align: middle; }
    .notif-badge.count { background: #1f2937; color: #fff; }
    .notif-badge.crit { background: #dc2626; color: #fff; }
    .notif-toast { position: fixed; top: 70px; right: 16px; max-width: 320px; z-index: 2000; background: #fff; border-left: 5px solid #dc2626; box-shadow: 0 8px 30px rgba(0,0,0,.2); border-radius: 10px; padding: 10px 14px; cursor: pointer; font-size: 13px; }
    .notif-toast b { display: block; margin-bottom: 2px; }
    .notification-bell.ring { animation: notifRing .8s ease; }
    @keyframes notifRing { 0%,100% { transform: rotate(0); } 20% { transform: rotate(14deg); } 40% { transform: rotate(-12deg); } 60% { transform: rotate(8deg); } 80% { transform: rotate(-6deg); } }
    /* Poora message dikhao (pehle 100 harf par kat jata tha): 3 line, phir "Show more" */
    .notification-message { white-space: pre-line; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .notification-item.expanded .notification-message { display: block; -webkit-line-clamp: unset; overflow: visible; }
    .notification-more { background: none; border: 0; padding: 0 0 4px; color: #667eea; font-size: 11px; font-weight: 600; cursor: pointer; }
    .category-btn:focus-visible, .notification-bell:focus-visible { outline: 2px solid #667eea; outline-offset: 2px; }
</style>

<script>
(function () {
    'use strict';

    var POLL_MS = 15000;                  // live: har 15s (tab chhupa ho to ruk jata hai)
    var currentCategory = 'all';
    var unreadOnly = false, searchText = '', searchTimer = null;
    var lastSeenId = null;                 // pehli dafa sirf yaad rakhta hai, toast nahi dikhata
    var baseTitle = document.title.replace(/^\(\d+\+?\)\s*/, '');
    var els = {
        bell: document.getElementById('notificationBell'),
        dropdown: document.getElementById('notificationDropdown'),
        badge: document.getElementById('notificationBadge'),
        list: document.getElementById('notificationList')
    };

    function getCookie(name) {
        var match = document.cookie.split(';').map(function (c) { return c.trim(); })
            .find(function (c) { return c.indexOf(name + '=') === 0; });
        return match ? decodeURIComponent(match.substring(name.length + 1)) : null;
    }

    function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text == null ? '' : String(text);
        return div.innerHTML;
    }

    // Only allow same-site relative links (blocks javascript: / external redirects)
    function safeLink(link) {
        if (!link || link === 'None' || link === 'null') return '';
        return (link.charAt(0) === '/' && link.charAt(1) !== '/') ? link : '';
    }

    function api(url, method) {
        return fetch(url, {
            method: method || 'GET',
            credentials: 'same-origin',
            headers: { 'X-CSRFToken': getCookie('csrftoken') || '', 'Content-Type': 'application/json' }
        }).then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
        });
    }

    var ICONS = {
        info: '\u2139\uFE0F', success: '\u2705', warning: '\u26A0\uFE0F', danger: '\u274C',
        sale: '\uD83D\uDED2', installment: '\uD83D\uDCC5', stock: '\uD83D\uDCE6', payment: '\uD83D\uDCB0'
    };

    function updateBadge(count) {
        if (!els.badge) return;
        count = Number(count) || 0;
        els.badge.style.display = count > 0 ? 'flex' : 'none';
        els.badge.textContent = count > 99 ? '99+' : count;
    }

    function renderNotifications(items) {
        if (!els.list) return;
        if (!items || !items.length) {
            els.list.innerHTML = '<div class="no-notifications"><i class="bi bi-bell-slash"></i><p>No notifications in this category</p></div>';
            return;
        }
        els.list.innerHTML = items.map(function (n) {
            var msg = String(n.message || '');
            var type = escapeHtml(n.notification_type);
            var prio = escapeHtml(n.priority || 'normal');
            var badges = (n.group_count > 1 ? '<span class="notif-badge count">\u00d7' + n.group_count + '</span>' : '') +
                         (n.priority === 'critical' ? '<span class="notif-badge crit">Critical</span>' : '');
            return '<div class="notification-item prio-' + prio + ' ' + (n.is_read ? '' : 'unread') + '" role="button" tabindex="0"' +
                ' data-id="' + escapeHtml(n.id) + '" data-link="' + escapeHtml(safeLink(n.link)) + '">' +
                '<div class="notification-icon ' + type + '">' + (ICONS[n.notification_type] || '\uD83D\uDD14') + '</div>' +
                '<div class="notification-content">' +
                '<div class="notification-title">' + (n.is_pinned ? '\uD83D\uDCCC ' : '') + escapeHtml(n.title) + badges + '</div>' +
                '<div class="notification-message">' + escapeHtml(msg) + '</div>' +
                ((msg.length > 110 || msg.split('\n').length > 3) ? '<button type="button" class="notification-more" aria-expanded="false">Show more</button>' : '') +
                '<div class="notification-time">' + escapeHtml(n.time_ago) + '</div>' +
                '</div></div>';
        }).join('');
    }

    function loadNotifications() {
        var qs = '?category=' + encodeURIComponent(currentCategory) +
                 (unreadOnly ? '&unread=1' : '') + (searchText ? '&q=' + encodeURIComponent(searchText) : '');
        api('/api/notifications/' + qs)
            .then(function (data) {
                renderNotifications(data.notifications);
                updateBadge(data.unread_count);
            })
            .catch(function () {
                if (els.list) els.list.innerHTML = '<div class="text-center p-3 text-danger small">Could not load notifications.</div>';
            });
    }

    function loadUnreadCount() {
        api('/api/notifications/unread-count/')
            .then(function (d) {
                updateBadge(d.unread_count);
                var n = Number(d.unread_count) || 0;
                document.title = (n > 0 ? '(' + (n > 99 ? '99+' : n) + ') ' : '') + baseTitle;
                var latest = Number(d.latest_id) || 0;
                if (lastSeenId !== null && latest > lastSeenId) onNewNotifications(d);
                lastSeenId = Math.max(lastSeenId || 0, latest);
            })
            .catch(function () { /* silent: badge keeps last value */ });
    }

    // Nayi notification aayi: panel khula ho to list taaza; Critical/High ho to bell hilao + toast
    function onNewNotifications(d) {
        if (els.dropdown.classList.contains('show')) loadNotifications();
        if (!(d.critical_unread > 0 || d.high_unread > 0)) return;
        els.bell.classList.remove('ring'); void els.bell.offsetWidth; els.bell.classList.add('ring');
        api('/api/notifications/?unread=1').then(function (r) {
            var top = (r.notifications || []).filter(function (n) { return n.priority === 'critical' || n.priority === 'high'; })[0];
            if (!top) return;
            var old = document.querySelector('.notif-toast'); if (old) old.remove();
            var t = document.createElement('div');
            t.className = 'notif-toast';
            t.setAttribute('role', 'alert');
            t.innerHTML = '<b>' + escapeHtml(top.title) + '</b>' + escapeHtml(String(top.message || '').substring(0, 120));
            t.addEventListener('click', function () { t.remove(); openDropdown(); });
            document.body.appendChild(t);
            setTimeout(function () { if (t.parentNode) t.remove(); }, 8000);
        }).catch(function () {});
    }

    function openDropdown() {
        els.dropdown.classList.add('show');
        els.bell.setAttribute('aria-expanded', 'true');
        loadNotifications();
    }
    function closeDropdown() {
        els.dropdown.classList.remove('show');
        els.bell.setAttribute('aria-expanded', 'false');
    }

    function filterNotifications(category) {
        currentCategory = category;
        document.querySelectorAll('.category-btn').forEach(function (btn) {
            btn.classList.toggle('active', btn.getAttribute('data-category') === category);
        });
        loadNotifications();
    }

    function markAllRead() {
        api('/api/notifications/mark-all-read/', 'POST')
            .then(function (d) { if (d.success) loadNotifications(); })
            .catch(function () {});
    }

    function toggleExpand(item) {
        var open = item.classList.toggle('expanded');
        var b = item.querySelector('.notification-more');
        if (b) { b.textContent = open ? 'Show less' : 'Show more'; b.setAttribute('aria-expanded', open ? 'true' : 'false'); }
    }

    function openNotification(item) {
        var id = item.getAttribute('data-id');
        var link = item.getAttribute('data-link');
        api('/api/notifications/' + encodeURIComponent(id) + '/mark-read/', 'POST').catch(function () {});
        if (!link) {                       // link nahi: panel band na karo, bas poora text kholo
            item.classList.remove('unread');
            if (!item.classList.contains('expanded')) toggleExpand(item);
            loadUnreadCount();
            return;
        }
        closeDropdown();
        window.location.href = link;
    }

    // Kept global: other templates may call these
    window.toggleNotifications = function () { els.dropdown.classList.contains('show') ? closeDropdown() : openDropdown(); };
    window.closeNotificationDropdown = closeDropdown;
    window.filterNotifications = filterNotifications;
    window.markAllRead = markAllRead;
    window.getCookie = window.getCookie || getCookie;

    if (!els.bell || !els.dropdown) return;

    els.bell.addEventListener('click', window.toggleNotifications);
    document.getElementById('markAllReadLink').addEventListener('click', function (e) { e.preventDefault(); markAllRead(); });
    document.querySelectorAll('.category-btn').forEach(function (btn) {
        btn.addEventListener('click', function () { filterNotifications(btn.getAttribute('data-category')); });
    });
    var unreadBox = document.getElementById('notifUnreadOnly'), searchBox = document.getElementById('notifSearch');
    if (unreadBox) unreadBox.addEventListener('change', function () { unreadOnly = unreadBox.checked; loadNotifications(); });
    if (searchBox) searchBox.addEventListener('input', function () {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function () { searchText = searchBox.value.trim(); loadNotifications(); }, 300);
    });
    els.list.addEventListener('click', function (e) {
        var item = e.target.closest('.notification-item');
        if (!item) return;
        if (e.target.closest('.notification-more')) { e.stopPropagation(); toggleExpand(item); return; }
        openNotification(item);
    });
    els.list.addEventListener('keydown', function (e) {
        var item = e.target.closest('.notification-item');
        if (item && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openNotification(item); }
    });
    document.addEventListener('click', function (e) {
        if (!els.bell.contains(e.target) && !els.dropdown.contains(e.target)) closeDropdown();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && els.dropdown.classList.contains('show')) { closeDropdown(); els.bell.focus(); }
    });

    loadUnreadCount();
    setInterval(function () { if (!document.hidden) loadUnreadCount(); }, POLL_MS);
})();
</script>
